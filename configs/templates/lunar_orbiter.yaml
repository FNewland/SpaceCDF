id: lunar_orbiter
name: "Lunar Science Orbiter"
archetype: lunar_orbiter
description: >
  Small lunar orbiter (~300 kg class) for remote sensing of the lunar surface
  from low lunar orbit. Delta-V-intensive — the propulsion budget dominates
  mass. Communications limited by distance (376 000 km) and eclipse seasons.

typical_use_cases:
  - Lunar surface remote sensing (imaging, spectroscopy)
  - Precursor to crewed exploration
  - Technology pathfinder for deep-space ops

tags: [lunar, deep_space, orbiter, science]

target_phase: phase_0
margin_policy_percent: 25.0    # Higher than LEO default — deep space convention

applicable_ecss:
  - ECSS-E-ST-10C Rev.1
  - ECSS-E-ST-10-02C Rev.1
  - ECSS-E-ST-10-04C Rev.1
  - ECSS-E-ST-10-06C
  - ECSS-E-ST-10-09C            # Coordinate systems (critical for deep space)
  - ECSS-E-ST-10-12C            # Radiation calc
  - ECSS-E-ST-10-24C Rev.1
  - ECSS-E-ST-31C
  - ECSS-E-ST-32C Rev.1
  - ECSS-E-ST-35C Rev.1
  - ECSS-E-ST-50C Rev.2
  - ECSS-E-ST-60-30C
  - ECSS-E-ST-70-41C            # PUS
  - ECSS-M-ST-10C Rev.1
  - ECSS-M-ST-80C
  - ECSS-Q-ST-30C Rev.1
  - ECSS-Q-ST-30-02C
  - ECSS-Q-ST-40C Rev.1
  - ECSS-Q-ST-60-15C Rev.1

requirements:
  name: "Lunar Orbiter"
  mission_type: lunar
  spacecraft_class: small
  orbit:
    orbit_type: lunar
    altitude_km: 100.0
    inclination_deg: 90.0
    eccentricity: 0.0
    delta_v_insertion_ms: 900.0
    delta_v_maintenance_ms: 100.0
    mission_duration_years: 2.0
    deorbit_required: false   # Lunar mission, no Earth deorbit
  payloads:
    - name: "Multispectral Imager"
      type: optical_imager
      mass_kg: 10.0
      power_w: 25.0
      power_peak_w: 40.0
      data_rate_mbps: 20.0
      data_volume_per_day_gb: 1.0
      pointing_accuracy_deg: 0.05
      pointing_stability_deg_s: 0.005
      temperature_range_c: [-20.0, 30.0]
      fov_deg: 3.0
      duty_cycle_percent: 30.0
      description: "Panchromatic + 6-band multispectral for lunar surface mapping"
    - name: "Infrared Spectrometer"
      type: spectrometer
      mass_kg: 6.0
      power_w: 15.0
      power_peak_w: 20.0
      data_rate_mbps: 5.0
      data_volume_per_day_gb: 0.3
      pointing_accuracy_deg: 0.1
      pointing_stability_deg_s: 0.01
      temperature_range_c: [-30.0, 20.0]
      fov_deg: 1.0
      duty_cycle_percent: 25.0
      description: "1-3 um spectrometer for mineral composition"
  design_lifetime_years: 2.0
  reliability_target: 0.9
  target_mass_kg: 300.0
  target_cost_meur: 80.0
  num_spacecraft: 1
  ground_stations:
    - "ESA Cebreros (DSN)"
    - "NASA DSN Goldstone"

equipment_hints:
  - category: thrusters
    rationale: "Bipropellant main engine (~450 s Isp) for 900 m/s lunar orbit insertion"
  - category: star_trackers
    rationale: "Dual cross-mounted trackers; gyro hybrid for eclipse safe-hold"
  - category: solar_cells
    rationale: "Deployable wings, sized for 45-minute eclipse seasons"

notes: |
  Key risk: lunar eclipse seasons drive battery sizing. Thermal control
  envelope wider than LEO due to surface albedo + IR from Moon.
  Recommend early coordination with DSN / ESA ESTRACK for comms window.
