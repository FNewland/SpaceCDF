# ECSS Review Gate → Expected Deliverables mapping
#
# Source: ECSS-E-ST-10C Rev.1 Annex A (Table A-1, informative) +
#         ECSS-M-ST-10C Rev.1 (phase/review structure).
#
# This is the simplified mapping used by the /api/ecss/compliance
# endpoint to tell the UI which DRDs (Document Requirements
# Descriptions) are expected at each review gate. Each entry lists
# the DRD short name, the owning ECSS standard, and an indication
# of whether SpaceCDF can currently auto-produce the document.
#
# Status codes for `produced_by`:
#   spacecdf     — currently auto-generated by SpaceCDF
#   partial      — partially covered by SpaceCDF output
#   external     — must be authored outside SpaceCDF
#   planned      — planned SpaceCDF feature
#
# Phase → Review gate mapping (ECSS-M-ST-10C Rev.1):
#   phase_0  ends at MDR  (Mission Definition Review)
#   phase_a  ends at PRR  (Preliminary Requirements Review)
#   phase_b1 ends at SRR  (System Requirements Review)
#   phase_b  ends at PDR  (Preliminary Design Review)  [future]
#   phase_c  ends at CDR  (Critical Design Review)    [future]

phases:
  phase_0:
    gate: MDR
    gate_name: "Mission Definition Review"
    description: >
      Exit of Phase 0. Purpose: validate mission need, identify stakeholders,
      establish top-level requirements and feasibility. Per ECSS-M-ST-10C.
    expected_drds:
      - id: MRD
        name: "Mission Requirements Document"
        standard: ECSS-E-ST-10C Rev.1
        annex: "A (informative)"
        produced_by: spacecdf
        spacecdf_source: "Study.requirements — MissionRequirements model"
      - id: MAD
        name: "Mission Analysis Document (preliminary)"
        standard: ECSS-E-ST-10C Rev.1
        annex: "A"
        produced_by: partial
        spacecdf_source: "Orbit + link budgets; lacks full mission analysis"
      - id: TECH_BUDGET_PRELIM
        name: "Preliminary technical budgets (mass, power, data, link)"
        standard: ECSS-E-ST-10C Rev.1
        annex: "A"
        produced_by: spacecdf
        spacecdf_source: "InsightsPanel + convergence result"
      - id: RISK_LIST_INITIAL
        name: "Initial risk list"
        standard: ECSS-M-ST-80C
        annex: "A (RMP) / B (Risk Register)"
        produced_by: partial
        spacecdf_source: "ConflictsPanel surfaces design conflicts but not formal risks"
      - id: TRL_ASSESS
        name: "TRL assessment of critical technologies"
        standard: ECSS-E-AS-11C
        annex: "—"
        produced_by: external

  phase_a:
    gate: PRR
    gate_name: "Preliminary Requirements Review"
    description: >
      Exit of Phase A. Purpose: consolidate requirements, demonstrate feasibility
      of candidate concept(s), establish applicable standards baseline.
    expected_drds:
      - id: MRD
        name: "Mission Requirements Document (consolidated)"
        standard: ECSS-E-ST-10C Rev.1
        annex: "A"
        produced_by: spacecdf
      - id: TS_DRAFT
        name: "Technical Specification (draft)"
        standard: ECSS-E-ST-10-06C
        annex: "A"
        produced_by: partial
        spacecdf_source: "Auto-generated requirements (see RequirementsPanel)"
      - id: SEMP
        name: "Systems Engineering Management Plan"
        standard: ECSS-E-ST-10C Rev.1
        annex: "A"
        produced_by: external
      - id: VP_DRAFT
        name: "Verification Plan (draft)"
        standard: ECSS-E-ST-10-02C Rev.1
        annex: "A"
        produced_by: spacecdf
        spacecdf_source: "GET /api/compliance/{study_id}/verification"
      - id: RMP
        name: "Risk Management Plan"
        standard: ECSS-M-ST-80C
        annex: "A"
        produced_by: external
      - id: RISK_REGISTER
        name: "Risk Register"
        standard: ECSS-M-ST-80C
        annex: "B"
        produced_by: partial
        spacecdf_source: "ConflictsPanel — design conflicts only, not full risk register"
      - id: TAILORING_MATRIX
        name: "ECSS Tailoring Matrix"
        standard: ECSS-S-ST-00-02C
        annex: "—"
        produced_by: spacecdf
        spacecdf_source: "GET /api/compliance/{study_id}/tailoring"
      - id: TECH_BUDGET
        name: "Technical budgets (mass, power, data, link, Δv, pointing)"
        standard: ECSS-E-ST-10C Rev.1
        annex: "A"
        produced_by: spacecdf
      - id: COMP_MATRIX
        name: "Requirements Compliance Matrix"
        standard: ECSS-E-ST-10-02C Rev.1
        annex: "B (VCD)"
        produced_by: spacecdf
        spacecdf_source: "ComplianceMatrix component"
      - id: DEBRIS_ANALYSIS
        name: "Debris Mitigation Analysis (preliminary)"
        standard: ECSS-U-AS-10C Rev.2
        annex: "—"
        produced_by: partial

  phase_b1:
    gate: SRR
    gate_name: "System Requirements Review"
    description: >
      Exit of Phase B1. Purpose: freeze requirements baseline, select architecture,
      demonstrate traceability from mission to system requirements.
    expected_drds:
      - id: TS
        name: "Technical Specification (baselined)"
        standard: ECSS-E-ST-10-06C
        annex: "A"
        produced_by: partial
      - id: IRD
        name: "Interface Requirements Document"
        standard: ECSS-E-ST-10-24C Rev.1
        annex: "A"
        produced_by: planned
      - id: VCD
        name: "Verification Control Document"
        standard: ECSS-E-ST-10-02C Rev.1
        annex: "B"
        produced_by: spacecdf
        spacecdf_source: "ComplianceMatrix — verification status per requirement"
      - id: SYS_ARCH
        name: "System Architecture Description"
        standard: ECSS-E-ST-10C Rev.1
        annex: "A"
        produced_by: partial
        spacecdf_source: "Subsystem/position structure; lacks SysML-level formality"
      - id: FMECA_PRELIM
        name: "Preliminary FMECA"
        standard: ECSS-Q-ST-30-02C
        annex: "—"
        produced_by: external
      - id: RAD_ENV
        name: "Radiation Environment Specification"
        standard: ECSS-E-ST-10-04C Rev.1
        annex: "—"
        produced_by: partial
      - id: TECH_BUDGET_BASELINE
        name: "Technical budgets (baselined)"
        standard: ECSS-E-ST-10C Rev.1
        annex: "A"
        produced_by: spacecdf
      - id: RISK_REGISTER
        name: "Risk Register (updated)"
        standard: ECSS-M-ST-80C
        annex: "B"
        produced_by: partial
      - id: DEBRIS_ANALYSIS
        name: "Debris Mitigation Analysis"
        standard: ECSS-U-AS-10C Rev.2
        annex: "—"
        produced_by: partial
