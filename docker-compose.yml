services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spacecdf
      POSTGRES_USER: spacecdf
      POSTGRES_PASSWORD: spacecdf_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://spacecdf:spacecdf_dev@postgres:5432/spacecdf
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./packages:/app/packages
    command: uvicorn spacecdf_server.app:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
