[project]
name = "spacecdf-ai"
version = "2.0.0"
description = "Optional GenAI capabilities for SpaceCDF — Claude-powered design assistance"
requires-python = ">=3.11"
dependencies = [
    "spacecdf-common",
    "anthropic>=0.40",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spacecdf_ai"]
