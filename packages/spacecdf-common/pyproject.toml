[project]
name = "spacecdf-common"
version = "0.1.0"
description = "Shared models, physics engines, and agent interfaces for SpaceCDF"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "sgp4>=2.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spacecdf_common"]
