[project]
name = "spacecdf-kb"
version = "0.1.0"
description = "Knowledge base: components, launch vehicles, ground stations, cost models"
requires-python = ">=3.11"
dependencies = [
    "spacecdf-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spacecdf_kb"]

[tool.hatch.build]
artifacts = ["src/spacecdf_kb/data/**/*.yaml"]
