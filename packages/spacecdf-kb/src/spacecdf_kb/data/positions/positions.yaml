# SpaceCDF Position-Based Guidance Definitions
# Each position maps to an ESA CDF workstation role.
# Parameter IDs match the SpaceCDF design state namespace.

positions:

  # ── 1. Systems Engineer ──────────────────────────────────────────────
  - id: systems_engineer
    name: Systems Engineer
    domain: systems
    icon: "\U0001F3DB"   # classical building
    description: >-
      Owns the overall system design. Maintains mass, power, and data budgets,
      monitors margins and requirement compliance, arbitrates inter-domain
      conflicts, and drives the design toward convergence.
    key_questions:
      - id: se-q1
        question: Is the total dry mass within the launch-vehicle allocation with adequate margin?
        category: verification
        priority: must_answer
        related_parameters:
          - mass.dry_mass_kg
          - mass.wet_mass_kg
          - systems.mass_margin_percent
        guidance: >-
          Sum all subsystem masses. Apply ECSS 20% system margin at Phase-A.
          Compare against selected LV capability to the target orbit.
        typical_range: ">20% margin at Phase-A"
        health_check: "systems.mass_margin_percent >= 20.0"
      - id: se-q2
        question: Is the power budget closed across all mission modes?
        category: verification
        priority: must_answer
        related_parameters:
          - systems.power_margin_percent
        guidance: >-
          Verify that generated power exceeds demand in sunlight, safe, and
          eclipse modes. Track subsystem power lines in the budget.
        typical_range: ">10% margin in worst-case mode"
        health_check: "systems.power_margin_percent >= 10.0"
      - id: se-q3
        question: What is the overall design health score?
        category: verification
        priority: must_answer
        related_parameters:
          - systems.health_score
        guidance: >-
          Health score aggregates margin status across mass, power, data, link,
          and delta-V budgets. Target green (>0.7) before Phase-A exit.
        typical_range: ">0.7 for Phase-A"
        health_check: "systems.health_score >= 0.7"
      - id: se-q4
        question: Are there unresolved inter-domain conflicts?
        category: verification
        priority: should_answer
        related_parameters:
          - systems.health_score
        guidance: >-
          Review the conflict log. Each conflict must either be resolved
          (parameter converged) or escalated with a documented trade-off.
        typical_range: "0 open conflicts"
      - id: se-q5
        question: Is the data budget balanced between generation and downlink capacity?
        category: verification
        priority: should_answer
        related_parameters:
          - data.generated_per_day_gb
          - data.downlinked_per_day_gb
        guidance: >-
          Compare daily data generated by the payload with downlink capacity.
          Include on-board storage capacity as a buffer.
        typical_range: "downlink >= generation with 20% margin"
    parameters:
      - param_pattern: "systems.*"
        role: owns
        description: System-level health metrics and margins
      - param_pattern: "mass.*"
        role: owns
        description: Mass budget roll-up
      - param_pattern: "data.*"
        role: consumes
        description: Data budget from payload and comms
      - param_pattern: "cost.total_meur"
        role: consumes
        description: Total mission cost
    depends_on: []
    feeds_into:
      - mission_analyst
      - payload_lead
      - power_engineer
      - aocs_engineer
      - thermal_engineer
      - comms_engineer
      - propulsion_engineer
      - structures_engineer
      - cost_engineer

  # ── 2. Mission Analyst ───────────────────────────────────────────────
  - id: mission_analyst
    name: Mission Analyst
    domain: orbit
    icon: "\U0001F30D"   # globe
    description: >-
      Defines the orbit, selects the launch vehicle, computes ground-station
      coverage, and derives eclipse and lighting conditions that drive
      power, thermal, and comms sizing.
    key_questions:
      - id: ma-q1
        question: What orbit altitude and inclination satisfy the mission requirements?
        category: sizing
        priority: must_answer
        related_parameters:
          - orbit.altitude_km
          - orbit.inclination_deg
        guidance: >-
          Start from payload requirements (resolution, coverage).
          Evaluate SSO, LEO, or GTO trade. Check radiation and debris
          environment at candidate altitudes.
        typical_range: "400-800 km for LEO EO missions"
        health_check: "orbit.altitude_km >= 200"
      - id: ma-q2
        question: Which launch vehicle provides adequate performance to the target orbit?
        category: selection
        priority: must_answer
        related_parameters:
          - orbit.altitude_km
          - mass.wet_mass_kg
        guidance: >-
          Match wet mass with margin to LV capacity for the target orbit.
          Consider rideshare vs. dedicated launch. Check fairing volume.
        typical_range: "Vega-C 2200 kg to SSO-600, Falcon 9 RS ~300 kg"
      - id: ma-q3
        question: What are the eclipse conditions and maximum eclipse duration?
        category: sizing
        priority: must_answer
        related_parameters:
          - orbit.altitude_km
          - orbit.eclipse_duration_min
        guidance: >-
          Compute eclipse fraction from orbit geometry and solar beta angle.
          Maximum eclipse duration drives battery sizing and heater demand.
        typical_range: "0-36 min for LEO, up to 72 min for GEO transfer"
      - id: ma-q4
        question: What ground-station contact time is available per orbit?
        category: sizing
        priority: should_answer
        related_parameters:
          - orbit.altitude_km
          - orbit.ground_contact_min_per_day
        guidance: >-
          Compute access windows for the selected ground-station network.
          Drives data downlink budget and LEOP planning.
        typical_range: "20-60 min/day for polar LEO, continuous for GEO"
      - id: ma-q5
        question: What is the mission lifetime considering orbital decay?
        category: verification
        priority: should_answer
        related_parameters:
          - orbit.altitude_km
          - orbit.lifetime_years
        guidance: >-
          Estimate atmospheric drag effects. Ensure 25-year post-mission
          deorbit compliance. Check whether active deorbit is needed.
        typical_range: "3-7 years operational for LEO"
    parameters:
      - param_pattern: "orbit.*"
        role: owns
        description: All orbital parameters
      - param_pattern: "mass.wet_mass_kg"
        role: consumes
        description: Needed for launch vehicle selection
    depends_on:
      - systems_engineer
    feeds_into:
      - power_engineer
      - thermal_engineer
      - comms_engineer
      - aocs_engineer

  # ── 3. Payload Lead ──────────────────────────────────────────────────
  - id: payload_lead
    name: Payload Lead
    domain: payload
    icon: "\U0001F4E1"   # satellite antenna
    description: >-
      Defines instrument requirements, data generation rates, pointing needs,
      and payload accommodation. The payload is the reason the mission exists;
      all other subsystems serve it.
    key_questions:
      - id: pl-q1
        question: What are the payload mass and power requirements?
        category: requirement
        priority: must_answer
        related_parameters:
          - payload.mass_kg
          - payload.power_w
        guidance: >-
          Start from instrument specs or heritage. Include electronics,
          harness, and thermal control for the payload module.
        typical_range: "10-30% of S/C dry mass for EO, up to 50% for science"
      - id: pl-q2
        question: How much data does the payload generate per day?
        category: sizing
        priority: must_answer
        related_parameters:
          - data.generated_per_day_gb
          - payload.data_rate_mbps
        guidance: >-
          Multiply data rate by duty cycle and orbit passes over target.
          Consider compression ratios. Drives on-board storage and downlink.
        typical_range: "1-50 GB/day for optical EO, 0.1-1 GB for SAR snapshot"
      - id: pl-q3
        question: What pointing accuracy does the payload require?
        category: requirement
        priority: must_answer
        related_parameters:
          - aocs.pointing_accuracy_deg
          - payload.pointing_requirement_deg
        guidance: >-
          Derive from instrument spatial resolution and swath requirements.
          This drives AOCS sensor and actuator selection.
        typical_range: "0.01-0.1 deg for HR EO, 1-5 deg for comms"
        health_check: "aocs.pointing_accuracy_deg <= payload.pointing_requirement_deg"
      - id: pl-q4
        question: Are there thermal or contamination constraints on the payload?
        category: requirement
        priority: should_answer
        related_parameters:
          - payload.operating_temp_min_c
          - payload.operating_temp_max_c
        guidance: >-
          IR instruments need cold focal planes; optical instruments need
          molecular contamination control. Drives thermal design.
        typical_range: "-20 to +40 C for optical, -150 to -80 C for IR FPA"
    parameters:
      - param_pattern: "payload.*"
        role: owns
        description: Payload characteristics and requirements
      - param_pattern: "data.generated_per_day_gb"
        role: owns
        description: Data generation from payload
      - param_pattern: "aocs.pointing_accuracy_deg"
        role: consumes
        description: AOCS-delivered pointing
    depends_on:
      - systems_engineer
      - mission_analyst
    feeds_into:
      - aocs_engineer
      - comms_engineer
      - thermal_engineer
      - power_engineer

  # ── 4. Power Engineer ────────────────────────────────────────────────
  - id: power_engineer
    name: Power Engineer
    domain: power
    icon: "\u26A1"   # lightning bolt
    description: >-
      Sizes the solar array, battery, and power conditioning. Ensures the
      spacecraft survives eclipse and meets power demand in all modes
      with adequate margin.
    key_questions:
      - id: pw-q1
        question: What solar array area is needed to close the power budget?
        category: sizing
        priority: must_answer
        related_parameters:
          - power.sa_area_m2
          - power.sa_power_eol_w
        guidance: >-
          Compute total power demand (payload + platform + margin).
          Apply solar cell efficiency, cos-loss, radiation degradation,
          and ECSS design factors. Account for eclipse fraction.
        typical_range: "0.5-3 m2 for small LEO, 10-30 m2 for GEO"
        health_check: "power.sa_area_m2 > 0"
      - id: pw-q2
        question: What battery capacity is needed for eclipse survival?
        category: sizing
        priority: must_answer
        related_parameters:
          - power.battery_capacity_wh
          - power.battery_dod_percent
        guidance: >-
          Multiply eclipse power demand by maximum eclipse duration.
          Limit depth of discharge (DoD) per battery chemistry cycle-life
          curve. Li-ion typically 20-40% DoD for LEO.
        typical_range: "20-40% DoD for LEO, 60-80% for GEO"
      - id: pw-q3
        question: What is the total EPS mass including harness?
        category: sizing
        priority: must_answer
        related_parameters:
          - power.eps_mass_kg
        guidance: >-
          Sum solar array, battery, PCDU, and harness masses.
          Include deployment mechanisms for body-mounted vs. deployable panels.
        typical_range: "15-25% of dry mass"
        health_check: "power.eps_mass_kg > 0"
      - id: pw-q4
        question: Does the power system survive end-of-life degradation?
        category: verification
        priority: should_answer
        related_parameters:
          - power.sa_power_eol_w
          - power.sa_degradation_percent
        guidance: >-
          Apply radiation degradation, UV aging, and contamination factors
          over the mission lifetime. EOL power must still close the budget.
        typical_range: "15-25% degradation over 5 years in LEO"
      - id: pw-q5
        question: Is the bus voltage compatible with all subsystem interfaces?
        category: verification
        priority: nice_to_have
        related_parameters:
          - power.bus_voltage_v
        guidance: >-
          Check unregulated bus voltage range vs. subsystem input ranges.
          28V unregulated is common; 50V or 100V for higher-power systems.
        typical_range: "28V for small, 50-100V for large"
    parameters:
      - param_pattern: "power.*"
        role: owns
        description: All power subsystem parameters
      - param_pattern: "orbit.eclipse_duration_min"
        role: consumes
        description: Eclipse duration from orbit analysis
      - param_pattern: "orbit.altitude_km"
        role: consumes
        description: Altitude for radiation environment
      - param_pattern: "payload.power_w"
        role: consumes
        description: Payload power demand
    depends_on:
      - mission_analyst
      - payload_lead
    feeds_into:
      - systems_engineer
      - thermal_engineer
      - structures_engineer

  # ── 5. AOCS Engineer ─────────────────────────────────────────────────
  - id: aocs_engineer
    name: AOCS Engineer
    domain: aocs
    icon: "\U0001F9ED"   # compass
    description: >-
      Designs the attitude and orbit control system. Selects sensors (star
      trackers, gyros, sun sensors) and actuators (reaction wheels, magnetorquers,
      thrusters) to meet payload pointing requirements.
    key_questions:
      - id: ao-q1
        question: Can the AOCS deliver the required pointing accuracy?
        category: verification
        priority: must_answer
        related_parameters:
          - aocs.pointing_accuracy_deg
          - payload.pointing_requirement_deg
        guidance: >-
          Root-sum-square sensor errors, actuator jitter, and structural
          flexibility. Compare against payload-derived requirement.
        typical_range: "0.01-0.1 deg with star tracker + RW"
        health_check: "aocs.pointing_accuracy_deg <= 0.1"
      - id: ao-q2
        question: What is the total AOCS subsystem mass?
        category: sizing
        priority: must_answer
        related_parameters:
          - aocs.mass_kg
        guidance: >-
          Sum reaction wheels (typically 4), star tracker, sun sensors,
          magnetorquers, gyro, and AOCS electronics.
        typical_range: "3-8 kg for small sat, 15-40 kg for large"
        health_check: "aocs.mass_kg > 0"
      - id: ao-q3
        question: Is reaction wheel momentum sufficient for the orbit environment?
        category: sizing
        priority: must_answer
        related_parameters:
          - aocs.rw_momentum_nms
          - aocs.disturbance_torque_nm
        guidance: >-
          Compute gravity-gradient, aerodynamic, and magnetic disturbance torques.
          Size wheel momentum storage for one orbit accumulation with margin.
        typical_range: "0.01-1 Nms for LEO small sat"
      - id: ao-q4
        question: Is a momentum dumping strategy defined?
        category: selection
        priority: should_answer
        related_parameters:
          - aocs.has_magnetorquers
        guidance: >-
          Magnetorquers for LEO desaturation, thrusters for higher orbits.
          Verify dumping rate exceeds secular momentum build-up.
        typical_range: "Magnetorquers standard for LEO"
      - id: ao-q5
        question: What AOCS power demand must the EPS support?
        category: sizing
        priority: should_answer
        related_parameters:
          - aocs.power_w
        guidance: >-
          Sum steady-state power for sensors and actuators. Include peak
          power during slew manoeuvres.
        typical_range: "5-20 W for small sat, 30-80 W for large"
    parameters:
      - param_pattern: "aocs.*"
        role: owns
        description: All AOCS parameters
      - param_pattern: "payload.pointing_requirement_deg"
        role: consumes
        description: Pointing requirement from payload
      - param_pattern: "orbit.altitude_km"
        role: consumes
        description: Altitude for disturbance environment
    depends_on:
      - mission_analyst
      - payload_lead
    feeds_into:
      - power_engineer
      - structures_engineer
      - systems_engineer

  # ── 6. Thermal Engineer ──────────────────────────────────────────────
  - id: thermal_engineer
    name: Thermal Engineer
    domain: thermal
    icon: "\U0001F321"   # thermometer
    description: >-
      Ensures all equipment stays within allowable temperature limits across
      hot and cold cases. Designs radiators, heaters, MLI, and heat pipes.
    key_questions:
      - id: th-q1
        question: Is the thermal balance positive in the worst cold case?
        category: verification
        priority: must_answer
        related_parameters:
          - thermal.heater_power_w
          - thermal.cold_case_min_c
        guidance: >-
          Compute minimum temperature at end of longest eclipse with
          minimum internal dissipation. Size heaters to keep batteries
          and propellant above survival limits.
        typical_range: ">0 C for batteries, >+10 C for hydrazine"
        health_check: "thermal.cold_case_min_c >= -20"
      - id: th-q2
        question: Can the hot case be managed with passive radiators?
        category: sizing
        priority: must_answer
        related_parameters:
          - thermal.radiator_area_m2
          - thermal.hot_case_max_c
        guidance: >-
          Compute maximum internal dissipation plus solar and albedo input.
          Size radiator area for worst hot case. Consider OSR or white paint.
        typical_range: "<50 C for electronics, <60 C for solar array"
        health_check: "thermal.hot_case_max_c <= 50"
      - id: th-q3
        question: What is the total TCS mass?
        category: sizing
        priority: must_answer
        related_parameters:
          - thermal.tcs_mass_kg
        guidance: >-
          Sum MLI, radiators, heaters, heat pipes, thermal straps, and
          thermistors. Typically 3-8% of dry mass.
        typical_range: "3-8% of dry mass"
        health_check: "thermal.tcs_mass_kg > 0"
      - id: th-q4
        question: Are there active thermal control needs (heat pipes, louvers)?
        category: selection
        priority: should_answer
        related_parameters:
          - thermal.active_cooling_required
        guidance: >-
          Needed if dissipation varies widely between modes, or for
          cryogenic payloads. Adds mass, cost, and complexity.
        typical_range: "Passive for small sats, active for large"
      - id: th-q5
        question: What heater power is needed during eclipse?
        category: sizing
        priority: should_answer
        related_parameters:
          - thermal.heater_power_w
          - orbit.eclipse_duration_min
        guidance: >-
          Compute heat loss during eclipse. Heater power adds to eclipse
          power demand, affecting battery sizing.
        typical_range: "5-30 W for small sat, 50-200 W for large"
    parameters:
      - param_pattern: "thermal.*"
        role: owns
        description: All thermal subsystem parameters
      - param_pattern: "orbit.eclipse_duration_min"
        role: consumes
        description: Eclipse duration for cold-case analysis
      - param_pattern: "orbit.altitude_km"
        role: consumes
        description: Altitude for thermal environment
      - param_pattern: "power.sa_area_m2"
        role: consumes
        description: Solar array area contributes to thermal balance
    depends_on:
      - mission_analyst
      - power_engineer
      - payload_lead
    feeds_into:
      - power_engineer
      - systems_engineer

  # ── 7. Communications Engineer ───────────────────────────────────────
  - id: comms_engineer
    name: Communications Engineer
    domain: link
    icon: "\U0001F4E1"   # antenna
    description: >-
      Designs the TT&C and data-downlink subsystem. Computes link budgets,
      selects antennas and transponders, and ensures data can be downlinked
      within available contact windows.
    key_questions:
      - id: co-q1
        question: Is the downlink budget closed with adequate margin?
        category: verification
        priority: must_answer
        related_parameters:
          - link.downlink_margin_db
        guidance: >-
          Compute EIRP, path loss, atmospheric loss, G/T, and required
          Eb/N0. ECSS requires >=3 dB margin for nominal link.
        typical_range: ">=3 dB margin per ECSS"
        health_check: "link.downlink_margin_db >= 3.0"
      - id: co-q2
        question: Can the daily data volume be downlinked within available contact time?
        category: verification
        priority: must_answer
        related_parameters:
          - data.downlinked_per_day_gb
          - data.generated_per_day_gb
          - link.data_rate_mbps
        guidance: >-
          Multiply link data rate by daily contact time. Must exceed daily
          data generation with margin for retransmissions and overhead.
        typical_range: "downlink >= 1.2x generation"
      - id: co-q3
        question: What is the TT&C subsystem mass?
        category: sizing
        priority: must_answer
        related_parameters:
          - link.ttc_mass_kg
        guidance: >-
          Sum transponder, antennas (S-band omni + X/Ka-band HGA), diplexer,
          cables, and switches.
        typical_range: "2-5 kg for small sat, 8-20 kg for large"
        health_check: "link.ttc_mass_kg > 0"
      - id: co-q4
        question: What frequencies and ground stations are used?
        category: selection
        priority: should_answer
        related_parameters:
          - link.frequency_ghz
          - orbit.ground_contact_min_per_day
        guidance: >-
          S-band for TTC, X-band for EO data, Ka-band for high throughput.
          Evaluate ESA ESTRACK, commercial networks, or dedicated ground segment.
        typical_range: "S-band TTC + X-band payload data for LEO EO"
      - id: co-q5
        question: What TT&C power demand must the EPS support?
        category: sizing
        priority: should_answer
        related_parameters:
          - link.power_w
        guidance: >-
          TX power plus transponder electronics. Peak during downlink pass.
          Drives power budget mode analysis.
        typical_range: "5-15 W for S-band, 20-80 W for X/Ka-band"
    parameters:
      - param_pattern: "link.*"
        role: owns
        description: All communications parameters
      - param_pattern: "data.downlinked_per_day_gb"
        role: owns
        description: Downlink capacity computation
      - param_pattern: "data.generated_per_day_gb"
        role: consumes
        description: Data volume to downlink
      - param_pattern: "orbit.ground_contact_min_per_day"
        role: consumes
        description: Available contact windows
      - param_pattern: "orbit.altitude_km"
        role: consumes
        description: Slant range for link budget
    depends_on:
      - mission_analyst
      - payload_lead
    feeds_into:
      - power_engineer
      - systems_engineer

  # ── 8. Propulsion Engineer ───────────────────────────────────────────
  - id: propulsion_engineer
    name: Propulsion Engineer
    domain: propulsion
    icon: "\U0001F680"   # rocket
    description: >-
      Sizes the propulsion system for orbit maintenance, collision avoidance,
      deorbit, and any orbit transfer needs. Selects thruster type and
      computes propellant mass.
    key_questions:
      - id: pr-q1
        question: What total delta-V is required over the mission lifetime?
        category: sizing
        priority: must_answer
        related_parameters:
          - propulsion.delta_v_total_ms
        guidance: >-
          Sum orbit maintenance, drag make-up (LEO), station-keeping,
          collision avoidance, and deorbit delta-V. Include margin.
        typical_range: "50-150 m/s for LEO maintenance + deorbit"
        health_check: "propulsion.delta_v_total_ms > 0"
      - id: pr-q2
        question: Which thruster type is selected (chemical / electric / cold-gas)?
        category: selection
        priority: must_answer
        related_parameters:
          - propulsion.thruster_type
          - propulsion.isp_s
        guidance: >-
          Chemical (monopropellant) for moderate delta-V and fast manoeuvres.
          Electric for high-Isp orbit raising. Cold gas for CubeSats.
        typical_range: "220 s Isp mono, 1500-3000 s electric, 60-70 s cold gas"
      - id: pr-q3
        question: What is the total propulsion subsystem mass (dry + propellant)?
        category: sizing
        priority: must_answer
        related_parameters:
          - propulsion.total_mass_kg
          - propulsion.propellant_mass_kg
        guidance: >-
          Compute propellant mass from Tsiolkovsky equation. Add tank,
          thruster, feed system, and plumbing dry mass.
        typical_range: "5-15% of wet mass for LEO"
        health_check: "propulsion.total_mass_kg > 0"
      - id: pr-q4
        question: Is the propulsion system compatible with spacecraft interfaces?
        category: verification
        priority: should_answer
        related_parameters:
          - propulsion.thruster_type
        guidance: >-
          Check contamination (hydrazine plume), thermal (thruster heat),
          EMC (electric propulsion), and structural (thrust vector alignment).
        typical_range: "Contamination cone 60-90 deg half-angle"
      - id: pr-q5
        question: Does the design comply with the 25-year deorbit rule?
        category: verification
        priority: should_answer
        related_parameters:
          - orbit.altitude_km
          - propulsion.delta_v_total_ms
        guidance: >-
          For LEO, verify sufficient delta-V for deorbit or passive decay
          within 25 years. Consider drag-augmentation devices as backup.
        typical_range: "Active deorbit for >600 km altitude"
    parameters:
      - param_pattern: "propulsion.*"
        role: owns
        description: All propulsion parameters
      - param_pattern: "orbit.altitude_km"
        role: consumes
        description: Orbit altitude for delta-V computation
      - param_pattern: "mass.dry_mass_kg"
        role: consumes
        description: Dry mass for Tsiolkovsky equation
    depends_on:
      - mission_analyst
      - structures_engineer
    feeds_into:
      - systems_engineer
      - structures_engineer

  # ── 9. Structures Engineer ───────────────────────────────────────────
  - id: structures_engineer
    name: Structures Engineer
    domain: structure
    icon: "\U0001F3D7"   # building construction
    description: >-
      Designs the primary and secondary structure, analyses loads and
      natural frequencies, manages the spacecraft configuration and
      mechanical interfaces.
    key_questions:
      - id: st-q1
        question: What is the structural mass including primary and secondary structure?
        category: sizing
        priority: must_answer
        related_parameters:
          - structure.mass_kg
        guidance: >-
          Primary structure typically 10-20% of dry mass. Add brackets,
          inserts, solar array deployment mechanisms, and antenna booms.
        typical_range: "10-20% of dry mass"
        health_check: "structure.mass_kg > 0"
      - id: st-q2
        question: Does the first natural frequency exceed the LV requirement?
        category: verification
        priority: must_answer
        related_parameters:
          - structure.first_natural_freq_hz
        guidance: >-
          LV typically requires >15 Hz lateral and >30 Hz axial.
          Perform FEA or hand-calc for primary structure with worst-case mass.
        typical_range: ">15 Hz lateral, >30 Hz axial"
        health_check: "structure.first_natural_freq_hz >= 15"
      - id: st-q3
        question: Does the spacecraft fit within the launch vehicle fairing?
        category: verification
        priority: must_answer
        related_parameters:
          - structure.envelope_x_m
          - structure.envelope_y_m
          - structure.envelope_z_m
        guidance: >-
          Check stowed configuration against fairing dynamic envelope.
          Include adapter ring and any protruding items.
        typical_range: "Mission-dependent; check LV user manual"
      - id: st-q4
        question: Are quasi-static load factors defined?
        category: requirement
        priority: should_answer
        related_parameters:
          - structure.max_qs_load_g
        guidance: >-
          Use LV-specified QSL factors. Apply factors of safety per ECSS
          (1.25 yield, 1.5 ultimate for metallic structure).
        typical_range: "5-10 g axial, 2-5 g lateral"
      - id: st-q5
        question: Is the adapter / separation system selected?
        category: selection
        priority: should_answer
        related_parameters:
          - structure.adapter_type
        guidance: >-
          Select from standard adapters (e.g., LPSS 937C, ESPA) or
          mission-specific. Must match LV interface and spacecraft mass.
        typical_range: "937C for small, 1194 for medium"
    parameters:
      - param_pattern: "structure.*"
        role: owns
        description: All structural parameters
      - param_pattern: "mass.dry_mass_kg"
        role: consumes
        description: Total dry mass for load analysis
      - param_pattern: "mass.wet_mass_kg"
        role: consumes
        description: Wet mass for LV interface
    depends_on:
      - systems_engineer
      - propulsion_engineer
    feeds_into:
      - systems_engineer
      - propulsion_engineer

  # ── 10. Cost Engineer ────────────────────────────────────────────────
  - id: cost_engineer
    name: Cost Engineer
    domain: cost
    icon: "\U0001F4B0"   # money bag
    description: >-
      Estimates mission cost using parametric cost estimation relationships
      (CER), tracks schedule, and provides programmatics oversight.
      Covers spacecraft, launch, ground segment, and operations costs.
    key_questions:
      - id: ce-q1
        question: What is the estimated total mission cost?
        category: sizing
        priority: must_answer
        related_parameters:
          - cost.total_meur
        guidance: >-
          Apply USCM, SSCM, or ESA parametric models. Input dry mass,
          power, mission lifetime, and TRL distribution.
        typical_range: "50-200 MEUR for ESA small mission"
        health_check: "cost.total_meur > 0"
      - id: ce-q2
        question: Is the cost within the programme budget envelope?
        category: verification
        priority: must_answer
        related_parameters:
          - cost.total_meur
          - cost.budget_cap_meur
        guidance: >-
          Compare estimated cost including margin against the programme
          budget cap. Flag if cost margin is below 10%.
        typical_range: ">10% cost margin"
        health_check: "cost.total_meur <= cost.budget_cap_meur"
      - id: ce-q3
        question: What are the main cost drivers?
        category: trade
        priority: must_answer
        related_parameters:
          - cost.platform_meur
          - cost.payload_meur
          - cost.launch_meur
          - cost.ground_meur
          - cost.operations_meur
        guidance: >-
          Identify top 3 cost drivers. Usually payload development,
          launch, and AIT. Look for cost-reduction opportunities.
        typical_range: "Payload 30-40%, platform 20-30%, launch 15-25%"
      - id: ce-q4
        question: What is the schedule from Phase-B to launch?
        category: sizing
        priority: should_answer
        related_parameters:
          - cost.schedule_months
        guidance: >-
          Estimate development schedule using analogies or parametric models.
          Include AIT, environmental test, and launch campaign.
        typical_range: "36-60 months Phase-B to launch for ESA small mission"
      - id: ce-q5
        question: Are there cost-reducing design-to-cost options?
        category: trade
        priority: nice_to_have
        related_parameters:
          - cost.total_meur
          - mass.dry_mass_kg
        guidance: >-
          Evaluate COTS vs. custom, rideshare vs. dedicated launch,
          platform heritage reuse, and ground-segment sharing.
        typical_range: "10-30% savings from design-to-cost trades"
    parameters:
      - param_pattern: "cost.*"
        role: owns
        description: All cost parameters
      - param_pattern: "mass.dry_mass_kg"
        role: consumes
        description: Dry mass is primary CER input
      - param_pattern: "power.sa_power_eol_w"
        role: consumes
        description: Power level drives cost
      - param_pattern: "orbit.altitude_km"
        role: consumes
        description: Orbit drives launch cost
    depends_on:
      - systems_engineer
      - structures_engineer
      - power_engineer
    feeds_into:
      - systems_engineer
