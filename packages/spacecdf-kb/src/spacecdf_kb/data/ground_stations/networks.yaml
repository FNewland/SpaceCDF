# Ground Station Network Knowledge Base
# Sources: publicly available ground station specifications, ITU filings
# Costs are estimates based on industry averages
# g_over_t_db_k is system figure of merit (higher is better)

stations:
  # --- KSAT (Kongsberg Satellite Services) ---
  - id: gs-ksat-svalbard
    name: SvalSat
    operator: KSAT
    location: Svalbard, Norway
    lat_deg: 78.23
    lon_deg: 15.39
    altitude_m: 500
    antenna_diameter_m: 13.0
    frequency_bands: [S-band, X-band, Ka-band]
    g_over_t_db_k: 28.5
    eirp_dbw: 65.0
    cost_per_pass_eur: 600
    notes: Unique polar location enables every LEO orbit pass; largest ground station in the Arctic

