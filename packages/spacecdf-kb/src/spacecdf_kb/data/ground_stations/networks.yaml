# Ground Station Network Knowledge Base
# Sources: publicly available ground station specifications, ITU filings, operator websites
# Costs are estimates based on industry averages (2025 pricing)
# g_over_t_db_k is system figure of merit (higher is better)

# ═══════════════════════════════════════════════════════════════════════
# NETWORKS — Aggregated ground station services
# ═══════════════════════════════════════════════════════════════════════

networks:
  - id: satnogs
    name: SatNOGS
    type: distributed_open
    stations: 400+
    bands: [UHF, VHF, S, L]
    cost_per_pass_eur: 0
    notes: Open-source distributed network run by the Libre Space Foundation. Free. Good for UHF/VHF CubeSats. Community-operated stations worldwide with varying antenna sizes (Yagi, helical, parabolic). Best for telemetry reception; uplink capability limited.
    url: https://network.satnogs.org

  - id: ksat-lite
    name: KSAT Lite
    type: commercial
    key_stations:
      - {name: Svalbard, lat: 78.23, lon: 15.39, bands: [S, X], antenna_m: 3.7}
      - {name: Troll, lat: -72.0, lon: 2.5, bands: [S, X], antenna_m: 3.7}
      - {name: Punta Arenas, lat: -53.1, lon: -70.9, bands: [S, X], antenna_m: 3.7}
    cost_per_pass_eur: 50-200
    notes: Commercial small-satellite ground service from KSAT. Pay-per-pass model with 3.7m antennas. Ideal for CubeSats and SmallSats needing S/X-band. Polar coverage via Svalbard and Troll.
    url: https://www.ksat.no/services/ksat-lite/

  - id: ksat
    name: KSAT (Kongsberg Satellite Services)
    type: commercial
    key_stations:
      - {name: SvalSat, lat: 78.23, lon: 15.39, bands: [S, X, Ka], antenna_m: 13}
      - {name: TrollSat, lat: -72.01, lon: 2.53, bands: [S, X], antenna_m: 7.3}
      - {name: Grimstad, lat: 58.33, lon: 8.59, bands: [S, X], antenna_m: 3.7}
    cost_per_pass_eur: 400-800
    notes: Major commercial ground station operator. SvalSat is the world's largest commercial ground station, offering every-orbit polar contact. Heritage with ESA, NASA, and commercial operators.
    url: https://www.ksat.no

  - id: ssc
    name: SSC (Swedish Space Corporation)
    type: commercial
    key_stations:
      - {name: Esrange/Kiruna, lat: 67.88, lon: 21.06, bands: [S, X, Ka], antenna_m: 13}
      - {name: Santiago, lat: -33.15, lon: -70.67, bands: [S, X], antenna_m: 9}
      - {name: North Pole, lat: 78.23, lon: 15.63, bands: [S, X], antenna_m: 13}
      - {name: Perth, lat: -31.80, lon: 115.89, bands: [S, X], antenna_m: 13}
    cost_per_pass_eur: 400-700
    notes: Swedish Space Corporation operates the Esrange Space Center in Kiruna plus a global network. Long ESA heritage. Also operates the Primus ground station network for SmallSats.
    url: https://www.sscspace.com

  - id: leaf-space
    name: Leaf Space
    type: commercial
    key_stations:
      - {name: Matera, lat: 40.65, lon: 16.70, bands: [S, X, UHF], antenna_m: 3.7}
      - {name: Azores, lat: 38.72, lon: -27.22, bands: [S, X], antenna_m: 3.7}
    cost_per_pass_eur: 150-350
    notes: European NewSpace ground station provider. GSaaS (Ground Segment as a Service) model with pay-per-pass pricing. Expanding network with focus on CubeSat and SmallSat support.
    url: https://leaf.space

  - id: atlas
    name: ATLAS Space Operations
    type: commercial
    key_stations:
      - {name: Punta Arenas, lat: -53.16, lon: -70.91, bands: [S, X], antenna_m: 7.3}
      - {name: Guam, lat: 13.44, lon: 144.79, bands: [S, X], antenna_m: 7.3}
    cost_per_pass_eur: 300-600
    notes: US-based commercial ground station network using Freedom software platform. Cloud-native scheduling and data delivery.
    url: https://atlasground.com

  - id: aws-ground-station
    name: AWS Ground Station
    type: cloud_native
    key_stations:
      - {name: US-East (Ohio), lat: 40.0, lon: -82.87, bands: [S, X], antenna_m: 5.4}
      - {name: US-West (Oregon), lat: 44.05, lon: -121.30, bands: [S, X], antenna_m: 5.4}
      - {name: Stockholm, lat: 59.33, lon: 18.07, bands: [S, X], antenna_m: 5.4}
      - {name: Bahrain, lat: 26.07, lon: 50.51, bands: [S, X], antenna_m: 5.4}
      - {name: Cape Town, lat: -33.93, lon: 18.42, bands: [S, X], antenna_m: 5.4}
      - {name: Hawaii, lat: 19.73, lon: -155.09, bands: [S, X], antenna_m: 5.4}
      - {name: Singapore, lat: 1.35, lon: 103.82, bands: [S, X], antenna_m: 5.4}
      - {name: Sydney, lat: -33.87, lon: 151.21, bands: [S, X], antenna_m: 5.4}
    cost_per_pass_eur: 250-450
    notes: Amazon cloud-native ground stations with direct S3 data delivery. Pay-per-minute pricing. Integrated with AWS compute for near-real-time processing. Expanding globally.
    url: https://aws.amazon.com/ground-station/

  - id: estrack
    name: ESA ESTRACK
    type: institutional
    key_stations:
      - {name: Cebreros, lat: 40.45, lon: -4.37, bands: [S, X, Ka], antenna_m: 35}
      - {name: New Norcia, lat: -31.05, lon: 116.19, bands: [S, X, Ka], antenna_m: 35}
      - {name: Malargue, lat: -35.78, lon: -69.40, bands: [S, X, Ka], antenna_m: 35}
      - {name: Redu, lat: 50.00, lon: 5.15, bands: [S, X, L], antenna_m: 15}
      - {name: Kiruna, lat: 67.86, lon: 20.22, bands: [S, X], antenna_m: 15}
      - {name: Kourou, lat: 5.25, lon: -52.81, bands: [S, X], antenna_m: 15}
    cost_per_pass_eur: 1200-8000
    notes: ESA's global tracking station network. Deep-space antennas at 120-degree separation. LEO support from Redu, Kiruna, Kourou, Villafranca. Available to ESA missions and third-party customers.
    url: https://www.esa.int/Enabling_Support/Operations/ESA_Ground_Stations/ESTRACK_tracking_stations

  - id: nasa-dsn
    name: NASA Deep Space Network
    type: institutional
    key_stations:
      - {name: Goldstone, lat: 35.43, lon: -116.89, bands: [S, X, Ka], antenna_m: 70}
      - {name: Canberra, lat: -35.40, lon: 148.98, bands: [S, X, Ka], antenna_m: 70}
      - {name: Madrid, lat: 40.43, lon: -4.25, bands: [S, X, Ka], antenna_m: 70}
    cost_per_pass_eur: 5000-10000
    notes: NASA's deep-space communication network. Three complexes at ~120-degree longitude separation provide continuous coverage for deep-space missions. Primarily for NASA missions, limited availability for others.
    url: https://www.jpl.nasa.gov/missions/dsn/

  - id: rbc-signals
    name: RBC Signals
    type: commercial
    key_stations:
      - {name: Hawaii, lat: 21.69, lon: -158.04, bands: [S, X, Ka], antenna_m: 11}
      - {name: Hartebeesthoek, lat: -25.89, lon: 27.71, bands: [S, X], antenna_m: 10}
    cost_per_pass_eur: 350-600
    notes: Global ground station aggregator with partner network. Aggregates underutilised capacity from telecom, research, and government antennas.
    url: https://www.rbcsignals.com

  - id: isro-istrac
    name: ISRO ISTRAC
    type: institutional
    key_stations:
      - {name: Bangalore, lat: 12.97, lon: 77.57, bands: [S, X, UHF], antenna_m: 11}
      - {name: Lucknow, lat: 26.85, lon: 80.95, bands: [S], antenna_m: 11}
      - {name: Mauritius, lat: -20.24, lon: 57.49, bands: [S], antenna_m: 7.5}
      - {name: Brunei, lat: 4.93, lon: 114.95, bands: [S], antenna_m: 7.5}
    cost_per_pass_eur: 0
    notes: Indian Space Research Organisation tracking network. Available for ISRO missions. Indian university satellites may access through ISRO agreements.
    url: https://www.isro.gov.in/ISTRAC.html


