# Sun Sensor Knowledge Base
# Coarse and fine sun sensors for CubeSat attitude determination
# Sources: manufacturer datasheets, satsearch.co

components:
  - id: ss-solarmems-nanossoc-d60
    name: nanoSSOC-D60
    manufacturer: Solar MEMS
    category: sun_sensor
    mass_kg: 0.005
    dimensions_mm: [27, 14, 6]
    cost_keur: 3
    trl: 9
    heritage_missions: [ESEO, Alsat-1N, FACSAT-2]
    performance:
      type: digital
      fov_deg: 120
      accuracy_deg: 0.5
      update_rate_hz: 10
    power_w: 0.05
    interfaces: [I2C, SPI]
    operating_temp_c: [-40, 85]
    notes: Ultra-compact digital sun sensor, widely used

  - id: ss-solarmems-nanossoc-a60
    name: nanoSSOC-A60
    manufacturer: Solar MEMS
    category: sun_sensor
    mass_kg: 0.004
    dimensions_mm: [27, 14, 5]
    cost_keur: 2
    trl: 9
    heritage_missions: [QB50 constellation]
    performance:
      type: analog
      fov_deg: 120
      accuracy_deg: 1.0
      update_rate_hz: 100
    power_w: 0.02
    interfaces: [analog]
    operating_temp_c: [-40, 85]
    notes: Analog output sun sensor, lowest cost option

  - id: ss-nss-css-01
    name: CSS-01
    manufacturer: NewSpace Systems
    category: sun_sensor
    mass_kg: 0.005
    dimensions_mm: [33, 11, 5]
    cost_keur: 2
    trl: 9
    heritage_missions: [ZACube-1, ZACube-2]
    performance:
      type: coarse
      fov_deg: 140
      accuracy_deg: 3.0
      update_rate_hz: 10
    power_w: 0.01
    interfaces: [analog]
    operating_temp_c: [-40, 85]
    notes: Coarse sun sensor, typically 6x for full sphere coverage

  - id: ss-hyperion-ss200
    name: SS200
    manufacturer: Hyperion Technologies
    category: sun_sensor
    mass_kg: 0.035
    dimensions_mm: [30, 30, 12]
    cost_keur: 8
    trl: 8
    heritage_missions: [TRISAT, CleanSpace-1]
    performance:
      type: fine_digital
      fov_deg: 140
      accuracy_deg: 0.1
      update_rate_hz: 10
    power_w: 0.15
    interfaces: [I2C, UART]
    operating_temp_c: [-40, 85]
    notes: Fine sun sensor for precision pointing

  - id: ss-cubespace-cubesense
    name: CubeSense
    manufacturer: CubeSpace
    category: sun_sensor
    mass_kg: 0.030
    dimensions_mm: [50, 35, 12]
    cost_keur: 6
    trl: 9
    heritage_missions: [ZACube-2, nSight-1, EIRSAT-1]
    performance:
      type: sun_and_nadir
      fov_deg: 180
      accuracy_deg: 1.0
      update_rate_hz: 1
      includes_nadir_sensor: true
    power_w: 0.15
    interfaces: [I2C, UART]
    operating_temp_c: [-40, 85]
    notes: Combined sun + nadir (Earth) sensor in one unit

  - id: ss-gom-nanosense-fss
    name: NanoSense FSS
    manufacturer: GomSpace
    category: sun_sensor
    mass_kg: 0.002
    dimensions_mm: [22, 11, 5]
    cost_keur: 3
    trl: 9
    heritage_missions: [GOMX-3, GOMX-4]
    performance:
      type: fine_digital
      fov_deg: 120
      accuracy_deg: 0.5
      update_rate_hz: 10
    power_w: 0.01
    interfaces: [I2C]
