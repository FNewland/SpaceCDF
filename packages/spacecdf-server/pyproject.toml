[project]
name = "spacecdf-server"
version = "0.1.0"
description = "FastAPI server for SpaceCDF concurrent design sessions"
requires-python = ">=3.11"
dependencies = [
    "spacecdf-common",
    "spacecdf-agents",
    "spacecdf-kb",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spacecdf_server"]
