<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
    <marker id="arrowD" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto"><polygon points="0 0, 3 8, 6 0" fill="#6b7280"/></marker>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="#0f172a" rx="8"/>
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="white" font-size="18" font-weight="bold">The System-V Model</text>
  <text x="400" y="50" text-anchor="middle" fill="#9ca3af" font-size="11">NASA SEH §2.3 — Decomposition (left) → Integration (right)</text>

  <!-- Left side labels -->
  <text x="60" y="90" fill="#8b5cf6" font-size="10" font-weight="bold">DECOMPOSITION</text>
  <!-- Right side labels -->
  <text x="680" y="90" fill="#10b981" font-size="10" font-weight="bold">INTEGRATION</text>

  <!-- V-shape lines -->
  <line x1="120" y1="100" x2="400" y2="420" stroke="#374151" stroke-width="2" stroke-dasharray="6 3"/>
  <line x1="400" y1="420" x2="680" y2="100" stroke="#374151" stroke-width="2" stroke-dasharray="6 3"/>

  <!-- Left side boxes (decomposition) -->
  <rect x="30" y="80" width="180" height="45" rx="6" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="120" y="100" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">Mission Need</text>
  <text x="120" y="115" text-anchor="middle" fill="#9ca3af" font-size="9">Stakeholders, Objectives</text>

  <rect x="80" y="160" width="180" height="45" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="2"/>
  <text x="170" y="180" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">Requirements</text>
  <text x="170" y="195" text-anchor="middle" fill="#9ca3af" font-size="9">SMART, WHAT not HOW</text>

  <rect x="140" y="240" width="180" height="45" rx="6" fill="#1e1b4b" stroke="#6d28d9" stroke-width="2"/>
  <text x="230" y="260" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">System Design</text>
  <text x="230" y="275" text-anchor="middle" fill="#9ca3af" font-size="9">Architecture, Interfaces</text>

  <rect x="200" y="320" width="180" height="45" rx="6" fill="#1e1b4b" stroke="#5b21b6" stroke-width="2"/>
  <text x="290" y="340" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">Subsystem Design</text>
  <text x="290" y="355" text-anchor="middle" fill="#9ca3af" font-size="9">Sizing, Equipment</text>

  <!-- Bottom -->
  <rect x="310" y="400" width="180" height="45" rx="6" fill="#1e1b4b" stroke="#4c1d95" stroke-width="2"/>
  <text x="400" y="420" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">Component Selection</text>
  <text x="400" y="435" text-anchor="middle" fill="#9ca3af" font-size="9">COTS, Custom, Make/Buy</text>

  <!-- Right side boxes (integration) -->
  <rect x="590" y="80" width="180" height="45" rx="6" fill="#052e16" stroke="#10b981" stroke-width="2"/>
  <text x="680" y="100" text-anchor="middle" fill="#86efac" font-size="11" font-weight="bold">Validation</text>
  <text x="680" y="115" text-anchor="middle" fill="#9ca3af" font-size="9">Meets stakeholder needs?</text>

  <rect x="540" y="160" width="180" height="45" rx="6" fill="#052e16" stroke="#059669" stroke-width="2"/>
  <text x="630" y="180" text-anchor="middle" fill="#86efac" font-size="11" font-weight="bold">System Verification</text>
  <text x="630" y="195" text-anchor="middle" fill="#9ca3af" font-size="9">Meets system requirements?</text>

  <rect x="480" y="240" width="180" height="45" rx="6" fill="#052e16" stroke="#047857" stroke-width="2"/>
  <text x="570" y="260" text-anchor="middle" fill="#86efac" font-size="11" font-weight="bold">Integration & Test</text>
  <text x="570" y="275" text-anchor="middle" fill="#9ca3af" font-size="9">Subsystems work together?</text>

  <rect x="420" y="320" width="180" height="45" rx="6" fill="#052e16" stroke="#065f46" stroke-width="2"/>
  <text x="510" y="340" text-anchor="middle" fill="#86efac" font-size="11" font-weight="bold">Component Verification</text>
  <text x="510" y="355" text-anchor="middle" fill="#9ca3af" font-size="9">Meets component spec?</text>

  <!-- Horizontal traceability arrows -->
  <line x1="210" y1="102" x2="590" y2="102" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowR)"/>
  <text x="400" y="96" text-anchor="middle" fill="#3b82f6" font-size="8">Traceability</text>

  <line x1="260" y1="182" x2="540" y2="182" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowR)"/>
  <line x1="320" y1="262" x2="480" y2="262" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowR)"/>
  <line x1="380" y1="342" x2="420" y2="342" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowR)"/>

  <!-- Phase labels -->
  <text x="400" y="475" text-anchor="middle" fill="#6b7280" font-size="10">Left side: NASA SEH Processes 1-4 (System Design) | Right side: Processes 5-8 (Product Realization)</text>
  <text x="400" y="490" text-anchor="middle" fill="#6b7280" font-size="9">Horizontal arrows: each level on the left has a corresponding verification on the right</text>
</svg>
