<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" font-family="Arial, sans-serif">
  <rect width="900" height="280" fill="#0f172a" rx="8"/>
  <text x="450" y="25" text-anchor="middle" fill="white" font-size="16" font-weight="bold">NASA &amp; ECSS Lifecycle Phases</text>

  <!-- NASA phases -->
  <text x="20" y="60" fill="#3b82f6" font-size="12" font-weight="bold">NASA:</text>
  <rect x="70" y="45" width="90" height="30" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="115" y="64" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="bold">Pre-A</text>
  <rect x="170" y="45" width="90" height="30" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="215" y="64" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="bold">Phase A</text>
  <rect x="270" y="45" width="90" height="30" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="315" y="64" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="bold">Phase B</text>
  <rect x="370" y="45" width="90" height="30" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="415" y="64" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="bold">Phase C</text>
  <rect x="470" y="45" width="90" height="30" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="515" y="64" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="bold">Phase D</text>
  <rect x="570" y="45" width="90" height="30" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="615" y="64" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="bold">Phase E</text>
  <rect x="670" y="45" width="90" height="30" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="715" y="64" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="bold">Phase F</text>

  <!-- NASA phase names -->
  <text x="115" y="90" text-anchor="middle" fill="#6b7280" font-size="7">Concept</text>
  <text x="115" y="99" text-anchor="middle" fill="#6b7280" font-size="7">Studies</text>
  <text x="215" y="90" text-anchor="middle" fill="#6b7280" font-size="7">Concept &amp;</text>
  <text x="215" y="99" text-anchor="middle" fill="#6b7280" font-size="7">Tech Dev</text>
  <text x="315" y="90" text-anchor="middle" fill="#6b7280" font-size="7">Prelim Design</text>
  <text x="315" y="99" text-anchor="middle" fill="#6b7280" font-size="7">&amp; Tech</text>
  <text x="415" y="90" text-anchor="middle" fill="#6b7280" font-size="7">Final Design</text>
  <text x="415" y="99" text-anchor="middle" fill="#6b7280" font-size="7">&amp; Fab</text>
  <text x="515" y="90" text-anchor="middle" fill="#6b7280" font-size="7">AIT &amp;</text>
  <text x="515" y="99" text-anchor="middle" fill="#6b7280" font-size="7">Launch</text>
  <text x="615" y="90" text-anchor="middle" fill="#6b7280" font-size="7">Operations</text>
  <text x="715" y="90" text-anchor="middle" fill="#6b7280" font-size="7">Closeout</text>

  <!-- Review gates (between phases) -->
  <text x="160" y="42" text-anchor="middle" fill="#f59e0b" font-size="8" font-weight="bold">MCR</text>
  <line x1="160" y1="44" x2="160" y2="76" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="260" y="42" text-anchor="middle" fill="#f59e0b" font-size="8" font-weight="bold">SRR</text>
  <line x1="260" y1="44" x2="260" y2="76" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="360" y="42" text-anchor="middle" fill="#f59e0b" font-size="8" font-weight="bold">PDR</text>
  <line x1="360" y1="44" x2="360" y2="76" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="460" y="42" text-anchor="middle" fill="#f59e0b" font-size="8" font-weight="bold">CDR</text>
  <line x1="460" y1="44" x2="460" y2="76" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="560" y="42" text-anchor="middle" fill="#f59e0b" font-size="8" font-weight="bold">FRR</text>
  <line x1="560" y1="44" x2="560" y2="76" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- ECSS phases -->
  <text x="20" y="130" fill="#10b981" font-size="12" font-weight="bold">ECSS:</text>
  <rect x="70" y="115" width="90" height="30" rx="4" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text x="115" y="134" text-anchor="middle" fill="#86efac" font-size="9" font-weight="bold">Phase 0</text>
  <rect x="170" y="115" width="90" height="30" rx="4" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text x="215" y="134" text-anchor="middle" fill="#86efac" font-size="9" font-weight="bold">Phase A</text>
  <rect x="270" y="115" width="90" height="30" rx="4" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text x="315" y="134" text-anchor="middle" fill="#86efac" font-size="9" font-weight="bold">Phase B</text>
  <rect x="370" y="115" width="90" height="30" rx="4" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text x="415" y="134" text-anchor="middle" fill="#86efac" font-size="9" font-weight="bold">Phase C</text>
  <rect x="470" y="115" width="90" height="30" rx="4" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text x="515" y="134" text-anchor="middle" fill="#86efac" font-size="9" font-weight="bold">Phase D</text>
  <rect x="570" y="115" width="90" height="30" rx="4" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text x="615" y="134" text-anchor="middle" fill="#86efac" font-size="9" font-weight="bold">Phase E</text>
  <rect x="670" y="115" width="90" height="30" rx="4" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text x="715" y="134" text-anchor="middle" fill="#86efac" font-size="9" font-weight="bold">Phase F</text>

  <!-- ECSS review gates -->
  <text x="160" y="160" text-anchor="middle" fill="#f97316" font-size="8" font-weight="bold">MDR</text>
  <text x="260" y="160" text-anchor="middle" fill="#f97316" font-size="8" font-weight="bold">PRR</text>
  <text x="360" y="160" text-anchor="middle" fill="#f97316" font-size="8" font-weight="bold">PDR</text>
  <text x="460" y="160" text-anchor="middle" fill="#f97316" font-size="8" font-weight="bold">CDR</text>
  <text x="560" y="160" text-anchor="middle" fill="#f97316" font-size="8" font-weight="bold">QR</text>

  <!-- Mapping arrows -->
  <text x="115" y="112" text-anchor="middle" fill="#6b7280" font-size="7">≈</text>
  <text x="215" y="112" text-anchor="middle" fill="#6b7280" font-size="7">≈</text>
  <text x="315" y="112" text-anchor="middle" fill="#6b7280" font-size="7">≈</text>
  <text x="415" y="112" text-anchor="middle" fill="#6b7280" font-size="7">≈</text>
  <text x="515" y="112" text-anchor="middle" fill="#6b7280" font-size="7">≈</text>
  <text x="615" y="112" text-anchor="middle" fill="#6b7280" font-size="7">≈</text>
  <text x="715" y="112" text-anchor="middle" fill="#6b7280" font-size="7">≈</text>

  <!-- Margin policy bar -->
  <text x="20" y="195" fill="#f59e0b" font-size="11" font-weight="bold">Margin Policy:</text>
  <rect x="70" y="180" width="90" height="25" rx="3" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
  <text x="115" y="196" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="bold">44%</text>
  <rect x="270" y="180" width="90" height="25" rx="3" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
  <text x="315" y="196" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="bold">32%</text>
  <rect x="370" y="180" width="90" height="25" rx="3" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
  <text x="415" y="196" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="bold">21%</text>
  <rect x="470" y="180" width="90" height="25" rx="3" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
  <text x="515" y="196" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="bold">13%</text>
  <rect x="570" y="180" width="90" height="25" rx="3" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
  <text x="615" y="196" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="bold">5%</text>

  <!-- Legend -->
  <text x="20" y="235" fill="#6b7280" font-size="9">MCR = Mission Concept Review | SRR = System Requirements Review | PDR = Preliminary Design Review</text>
  <text x="20" y="248" fill="#6b7280" font-size="9">CDR = Critical Design Review | FRR = Flight Readiness Review | MDR = Mission Definition Review</text>
  <text x="20" y="261" fill="#6b7280" font-size="9">PRR = Preliminary Requirements Review | QR = Qualification Review</text>
  <text x="20" y="274" fill="#6b7280" font-size="9">Margin policy: ECSS-E-HB-10-02A compound (equipment + system) mass margin by phase</text>
</svg>
