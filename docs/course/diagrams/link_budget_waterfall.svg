<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Arial, sans-serif">
  <rect width="700" height="400" fill="#0f172a" rx="8"/>
  <text x="350" y="25" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Link Budget Waterfall (S-band, 500 km)</text>

  <!-- Y axis -->
  <line x1="80" y1="50" x2="80" y2="350" stroke="#374151" stroke-width="1"/>
  <text x="15" y="200" text-anchor="middle" fill="#9ca3af" font-size="10" transform="rotate(-90 15 200)">Power Level (dBW / dBHz)</text>

  <!-- Grid lines and labels -->
  <line x1="80" y1="80" x2="660" y2="80" stroke="#1f2937" stroke-width="0.5"/>
  <text x="75" y="84" text-anchor="end" fill="#6b7280" font-size="8">+40</text>
  <line x1="80" y1="130" x2="660" y2="130" stroke="#1f2937" stroke-width="0.5"/>
  <text x="75" y="134" text-anchor="end" fill="#6b7280" font-size="8">+20</text>
  <line x1="80" y1="180" x2="660" y2="180" stroke="#1f2937" stroke-width="0.5"/>
  <text x="75" y="184" text-anchor="end" fill="#6b7280" font-size="8">0</text>
  <line x1="80" y1="230" x2="660" y2="230" stroke="#1f2937" stroke-width="0.5"/>
  <text x="75" y="234" text-anchor="end" fill="#6b7280" font-size="8">-20</text>

  <!-- Waterfall bars -->
  <!-- TX Power: +3 dBW (2W) -->
  <rect x="100" y="170" width="50" height="10" fill="#10b981"/>
  <text x="125" y="165" text-anchor="middle" fill="#10b981" font-size="8" font-weight="bold">+3.0</text>
  <text x="125" y="195" text-anchor="middle" fill="#9ca3af" font-size="7">TX Pwr</text>

  <!-- TX Gain: +6 dBi -->
  <rect x="160" y="160" width="50" height="20" fill="#10b981"/>
  <text x="185" y="155" text-anchor="middle" fill="#10b981" font-size="8" font-weight="bold">+6.0</text>
  <text x="185" y="195" text-anchor="middle" fill="#9ca3af" font-size="7">TX Gain</text>

  <!-- TX Losses: -1.5 dB -->
  <rect x="220" y="160" width="50" height="5" fill="#ef4444"/>
  <text x="245" y="155" text-anchor="middle" fill="#ef4444" font-size="8">-1.5</text>
  <text x="245" y="195" text-anchor="middle" fill="#9ca3af" font-size="7">TX Loss</text>

  <!-- EIRP result: +7.5 dBW -->
  <rect x="280" y="155" width="50" height="25" fill="#3b82f6"/>
  <text x="305" y="150" text-anchor="middle" fill="#3b82f6" font-size="8" font-weight="bold">EIRP +7.5</text>
  <text x="305" y="195" text-anchor="middle" fill="#9ca3af" font-size="7">EIRP</text>

  <!-- FSPL: -164 dB (massive loss) -->
  <rect x="340" y="155" width="50" height="150" fill="#ef4444" opacity="0.7"/>
  <text x="365" y="315" text-anchor="middle" fill="#ef4444" font-size="8" font-weight="bold">-164</text>
  <text x="365" y="330" text-anchor="middle" fill="#9ca3af" font-size="7">FSPL</text>

  <!-- Atm + pointing + pol losses: -1.8 dB -->
  <rect x="400" y="305" width="50" height="5" fill="#ef4444"/>
  <text x="425" y="325" text-anchor="middle" fill="#ef4444" font-size="8">-1.8</text>
  <text x="425" y="340" text-anchor="middle" fill="#9ca3af" font-size="7">Losses</text>

  <!-- RX Gain: +35 dBi -->
  <rect x="460" y="225" width="50" height="85" fill="#10b981"/>
  <text x="485" y="220" text-anchor="middle" fill="#10b981" font-size="8" font-weight="bold">+35</text>
  <text x="485" y="340" text-anchor="middle" fill="#9ca3af" font-size="7">RX Gain</text>

  <!-- G/T: +13.2 dB/K -->
  <rect x="520" y="210" width="50" height="20" fill="#f59e0b"/>
  <text x="545" y="205" text-anchor="middle" fill="#f59e0b" font-size="8" font-weight="bold">G/T +13.2</text>
  <text x="545" y="245" text-anchor="middle" fill="#9ca3af" font-size="7">G/T</text>

  <!-- C/N0 bar -->
  <rect x="580" y="90" width="50" height="130" fill="#3b82f6" opacity="0.5"/>
  <text x="605" y="85" text-anchor="middle" fill="#3b82f6" font-size="8" font-weight="bold">C/N₀</text>
  <text x="605" y="245" text-anchor="middle" fill="#9ca3af" font-size="7">C/N₀</text>

  <!-- Margin indicator -->
  <rect x="640" y="215" width="40" height="15" rx="3" fill="#10b981"/>
  <text x="660" y="227" text-anchor="middle" fill="white" font-size="9" font-weight="bold">+6 dB</text>
  <text x="660" y="245" text-anchor="middle" fill="#10b981" font-size="8">MARGIN</text>

  <!-- Formula -->
  <text x="350" y="370" text-anchor="middle" fill="#d1d5db" font-size="9">Margin = EIRP − FSPL − Losses + G/T + 228.6 − 10·log₁₀(Rb) − Eb/N₀_req − Impl</text>
  <text x="350" y="385" text-anchor="middle" fill="#6b7280" font-size="8">Per ECSS-E-ST-50-05C | Minimum margin: 3 dB (Phase B+)</text>
</svg>
